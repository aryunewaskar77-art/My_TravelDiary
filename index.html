<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelDiary - My Personal Memories</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-wrapper">
        <div class="login-box">
            <div class="logo">My Travel Diary</div>
            <h1>Your Journey, Captured.</h1>
            <p>Enter your Gmail and use the same as your password.</p>
            <form id="customLoginForm" class="login-form">
                <input type="email" id="loginEmail" placeholder="example@gmail.com" required>
                <input type="password" id="loginPassword" placeholder="Your password" required>
                <button type="submit" class="primary-btn" style="width: 100%;">Sign In</button>
            </form>
            <div style="margin-top: 1.5rem;">
                <!-- <button id="guestBtn" class="text-btn" style="color: var(--primary); font-size: 1rem;">Continue as
                    Guest</button> -->
            </div>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="appScreen" style="display: none;">
        <header>
            <div class="logo">My Travel Diary</div>
            <div class="header-actions">
                <div id="userProfile" class="user-profile">
                    <img id="userPic" src="" alt="Profile">
                    <span id="userName"></span>
                    <button id="signOutBtn" class="text-btn">Sign Out</button>
                </div>
                <button id="addEntryBtn" class="primary-btn">Add New memory</button>
            </div>
        </header>

        <main id="diaryEntries" class="entries-grid">
            <!-- Entries injected here -->
        </main>

        <!-- Entry Creation Modal -->
        <div id="entryModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Record Your Journey</h2>
                <form id="entryForm">
                    <div class="form-group">
                        <label for="title">Title of the Place</label>
                        <input type="text" id="title" required placeholder="E.g., Sunset at Santorini">
                    </div>
                    <div class="form-group">
                        <label for="memory">Your Written Memory</label>
                        <textarea id="memory" required placeholder="Describe your experience..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="media">Upload Thumbnail (Sets memory theme)</label>
                        <input type="file" id="media" accept="image/*" required>
                    </div>
                    <button type="submit" class="submit-btn">Save Memory</button>
                </form>
            </div>
        </div>

        <!-- Detail View Page (Simulated with full-screen modal) -->
        <div id="viewModal" class="modal detail-modal full-page-view">
            <div class="modal-content full-view">
                <header class="detail-page-header">
                    <button class="back-btn">&larr; Back to Journal</button>
                    <div class="detail-actions">
                        <input type="file" id="changeCoverInput" accept="image/*" hidden>
                        <button id="changeCoverBtn" class="secondary-btn" style="display: none;">Change Cover</button>
                        <button id="editBtn" class="secondary-btn">Edit Memory</button>
                        <div class="inline-media-adder">
                            <label for="inlineMedia" class="add-media-label">+ Add Photos/Videos</label>
                            <input type="file" id="inlineMedia" accept="image/*,video/*" multiple hidden>
                        </div>
                    </div>
                </header>
                <div id="detailContent">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Theme Switcher -->
            <div class="theme-switcher">
                <button id="themeToggleBtn" class="theme-toggle-btn" title="Change Theme">🎨</button>
                <div id="themeMenu" class="theme-menu">
                    <div class="theme-menu-title">Card Theme</div>
                    <button class="theme-option theme-tropical-opt" data-theme="tropical"><span></span> 🌴
                        Tropical</button>
                    <button class="theme-option theme-mountain-opt" data-theme="mountain"><span></span> 🏔
                        Mountain</button>
                    <button class="theme-option theme-city-opt" data-theme="city"><span></span> 🌆 City</button>
                    <button class="theme-option theme-beach-opt" data-theme="beach-sunset"><span></span> 🏝 Beach
                        Sunset</button>
                    <button class="theme-option" data-theme="default"><span></span> 🌿 Default</button>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
</body>

</html>
